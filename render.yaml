databases:
  - name: tutoros-db
    databaseName: tutoros
    user: tutoros
    plan: free

services:
  - type: redis
    name: tutoros-redis
    plan: free
    ipAllowList: []

  - type: web
    name: tutoros-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tutoros-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: tutoros-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: LOG_LEVEL
        value: INFO
      - key: STORAGE_BACKEND
        value: local
      - key: UPLOAD_DIR
        value: ./uploads
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      # Set these to real values in the Render dashboard after the first
      # deploy -- never commit real secrets into this file.
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # The worker only ever runs process_extraction_job / recalculate_after_attempt
  # (see app/celery_app.py) -- it never touches a JWT or the Google OAuth flow,
  # so it only gets the env vars those two jobs actually read: the DB, Redis,
  # the AI provider, and storage config (PDF extraction reads/writes files).
  - type: worker
    name: tutoros-celery-worker
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: "celery -A app.celery_app worker --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tutoros-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: tutoros-redis
          property: connectionString
      - key: LOG_LEVEL
        value: INFO
      - key: STORAGE_BACKEND
        value: local
      - key: UPLOAD_DIR
        value: ./uploads
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_API_KEY
        sync: false
