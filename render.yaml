databases:
  - name: tutoros-db
    databaseName: tutoros
    user: tutoros
    plan: free

services:
  - type: redis
    name: tutoros-redis
    plan: free
    ipAllowList: []

  - type: web
    name: tutoros-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # A brand-new Render Postgres can take a few seconds after being
    # provisioned before it actually accepts connections -- retry the
    # migration instead of failing the whole deploy on a cold-start race.
    startCommand: >-
      for i in 1 2 3 4 5 6; do alembic upgrade head && break || sleep 5; done &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: tutoros-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: tutoros-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: LOG_LEVEL
        value: INFO
      - key: STORAGE_BACKEND
        value: local
      - key: UPLOAD_DIR
        value: ./uploads
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      # Set these to real values in the Render dashboard after the first
      # deploy -- never commit real secrets into this file.
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # Background Worker services require a paid Render plan (not available on
  # Free) -- deliberately omitted for now. Without it, PDF-to-quiz extraction
  # jobs are accepted and queued in Redis but never processed (they'll sit at
  # status=PENDING forever), and post-attempt analytics recalculation just
  # doesn't auto-run in the background. Everything else (auth, batches,
  # homework, manual grading, mastery display, Google/Gemini-backed AI
  # generation that runs synchronously, etc.) is unaffected. Re-add this
  # block, changing `plan: free` to `plan: starter` (or above), once/if this
  # deploy moves to a paid tier:
  #
  # - type: worker
  #   name: tutoros-celery-worker
  #   runtime: python
  #   plan: starter
  #   rootDir: backend
  #   buildCommand: pip install -r requirements.txt
  #   startCommand: "celery -A app.celery_app worker --loglevel=info"
  #   envVars:
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: tutoros-db
  #         property: connectionString
  #     - key: REDIS_URL
  #       fromService:
  #         type: redis
  #         name: tutoros-redis
  #         property: connectionString
  #     - key: LOG_LEVEL
  #       value: INFO
  #     - key: STORAGE_BACKEND
  #       value: local
  #     - key: UPLOAD_DIR
  #       value: ./uploads
  #     - key: AI_PROVIDER
